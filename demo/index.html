<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DashVoice — Animation Showcase</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --c-listen: #4CAF50;
  --c-think:  #2196F3;
  --c-speak:  #9C27B0;
  --bg: #0a0a0f;
}

body {
  background: var(--bg);
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

/* ── Header ── */
header {
  width: 100%;
  padding: 24px 32px 0;
  text-align: center;
}
header h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.05em; color: rgba(255,255,255,0.85); }
header p  { font-size: 13px; color: rgba(255,255,255,0.35); margin-top: 4px; }

/* ── Tab nav ── */
nav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  padding: 20px 16px 0;
}
nav button {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.10);
  color: rgba(255,255,255,0.55);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 8px 18px;
  border-radius: 100px;
  cursor: pointer;
  transition: all 0.2s;
}
nav button:hover { background: rgba(255,255,255,0.12); color: #fff; }
nav button.active {
  background: rgba(255,255,255,0.14);
  border-color: rgba(255,255,255,0.3);
  color: #fff;
}

/* ── Stage ── */
.stage {
  position: relative;
  width: 100%;
  max-width: 480px;
  height: 380px;
  margin: 24px auto 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
canvas#main {
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 480px;
  height: 380px;
}

/* ── State bar ── */
.state-bar {
  position: absolute;
  bottom: -8px;
  left: 50%; transform: translateX(-50%);
  display: flex; gap: 16px;
  align-items: center;
}
.state-dot {
  width: 8px; height: 8px; border-radius: 50%;
  opacity: 0.3; transition: opacity 0.3s, transform 0.3s;
}
.state-dot.active { opacity: 1; transform: scale(1.4); }
#dotListen { background: var(--c-listen); }
#dotThink  { background: var(--c-think); }
#dotSpeak  { background: var(--c-speak); }

/* ── Info ── */
.info {
  text-align: center;
  min-height: 56px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.info-label { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.3); }
.info-text  { font-size: 16px; color: rgba(255,255,255,0.75); min-height: 24px; }
.info-sub   { font-size: 13px; color: rgba(255,255,255,0.35); min-height: 20px; }

/* ── Trigger ── */
.trigger-wrap { padding: 8px 0 40px; }
.trigger-btn {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.9);
  font-size: 16px;
  font-weight: 500;
  letter-spacing: 0.05em;
  padding: 14px 44px;
  border-radius: 100px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex; align-items: center; gap: 10px;
}
.trigger-btn:hover:not(:disabled) { background: rgba(255,255,255,0.13); transform: scale(1.04); }
.trigger-btn:disabled { opacity: 0.35; cursor: default; }
</style>
</head>
<body>

<header>
  <h1>🎙 DashVoice — Animationen</h1>
  <p>Klicke eine Variante, dann „Ok Nabu" um die Sequenz zu starten</p>
</header>

<nav id="nav"></nav>

<div class="stage">
  <canvas id="main" width="480" height="380"></canvas>
  <div class="state-bar">
    <div class="state-dot" id="dotListen"></div>
    <div class="state-dot" id="dotThink"></div>
    <div class="state-dot" id="dotSpeak"></div>
  </div>
</div>

<div class="info">
  <div class="info-label" id="infoLabel"></div>
  <div class="info-text"  id="infoText"></div>
  <div class="info-sub"   id="infoSub"></div>
</div>

<div class="trigger-wrap">
  <button class="trigger-btn" id="triggerBtn" onclick="trigger()">🎙 Ok Nabu</button>
</div>

<script>
// ═══════════════════════════════════════════════════
//  SHARED INFRASTRUCTURE
// ═══════════════════════════════════════════════════
const C = document.getElementById('main');
const X = C.getContext('2d');
const W = C.width, H = C.height, CX = W/2, CY = H/2;

const COL = {
  IDLE:      null,
  LISTENING: [76,175,80],
  THINKING:  [33,150,243],
  SPEAKING:  [156,39,176],
};

let curState = 'IDLE';
let lerpRGB  = [76,175,80];
let animId   = null;
let running  = false;
let seqTimer = [];
let currentDemo = 0;

function lerp(a,b,t){ return a+(b-a)*t; }
function lerpV(a,b,t){ return a.map((v,i)=>lerp(v,b[i],t)); }
function rgb(c,a=1){ return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function h2r(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function setState(s){
  curState = s;
  document.getElementById('dotListen').className = 'state-dot' + (s==='LISTENING'?' active':'');
  document.getElementById('dotThink' ).className = 'state-dot' + (s==='THINKING' ?' active':'');
  document.getElementById('dotSpeak' ).className = 'state-dot' + (s==='SPEAKING' ?' active':'');
  const labels = {IDLE:'',LISTENING:'Zuhören…',THINKING:'Verarbeite…',SPEAKING:'Antwortet…'};
  document.getElementById('infoLabel').textContent = labels[s] || '';
}

async function trigger(){
  if(running) return;
  running = true;
  document.getElementById('triggerBtn').disabled = true;
  document.getElementById('infoText').textContent = '';
  document.getElementById('infoSub').textContent = '';

  DEMOS[currentDemo].onStateChange?.('LISTENING');
  setState('LISTENING');
  await sleep(3000);

  DEMOS[currentDemo].onStateChange?.('THINKING');
  setState('THINKING');
  typewrite('infoText','"Licht Wohnzimmer an"',40);
  await sleep(2500);

  DEMOS[currentDemo].onStateChange?.('SPEAKING');
  setState('SPEAKING');
  typewrite('infoSub','Okay, das Licht wird eingeschaltet.',25);
  await sleep(3200);

  DEMOS[currentDemo].onStateChange?.('IDLE');
  setState('IDLE');
  document.getElementById('infoLabel').textContent = '';
  await sleep(600);
  document.getElementById('infoText').textContent = '';
  document.getElementById('infoSub').textContent = '';
  running = false;
  document.getElementById('triggerBtn').disabled = false;
}

function typewrite(id, text, ms){
  const el = document.getElementById(id);
  el.textContent = ''; let i=0;
  const iv = setInterval(()=>{ el.textContent += text[i++]; if(i>=text.length) clearInterval(iv); }, ms);
}

function stopAnim(){ if(animId){ cancelAnimationFrame(animId); animId=null; } }
function startLoop(fn){
  stopAnim();
  const loop = (ts)=>{ fn(ts); animId = requestAnimationFrame(loop); };
  animId = requestAnimationFrame(loop);
}

function switchDemo(idx){
  stopAnim();
  setState('IDLE');
  running = false;
  document.getElementById('triggerBtn').disabled = false;
  document.getElementById('infoText').textContent = '';
  document.getElementById('infoSub').textContent = '';
  document.getElementById('infoLabel').textContent = '';
  X.clearRect(0,0,W,H);
  currentDemo = idx;
  document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',i===idx));
  DEMOS[idx].init();
}


// ═══════════════════════════════════════════════════
//  DEMO 1 — RIPPLE ORB
// ═══════════════════════════════════════════════════
const demoOrb = (()=>{
  let particles=[], t0=0;
  const DOT=70, MAX=160;

  function spawn(col){
    for(let i=0;i<22;i++){
      const a=Math.random()*Math.PI*2, sp=2+Math.random()*4;
      particles.push({x:CX,y:CY,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:2+Math.random()*3,a:1,d:0.02+Math.random()*0.012,col});
    }
  }

  function draw(ts){
    const dt = ts-t0;
    X.clearRect(0,0,W,H);
    const col = COL[curState]||COL.LISTENING;
    lerpRGB = lerpV(lerpRGB, col, 0.06);
    const c = lerpRGB;

    if(curState!=='IDLE'){
      const cycleMs = curState==='SPEAKING'?900:curState==='THINKING'?2000:1400;
      const rings   = curState==='SPEAKING'?4:curState==='THINKING'?3:5;
      const phase   = (dt%cycleMs)/cycleMs;
      const sw = 5;
      for(let i=0;i<rings;i++){
        const p=((phase+i/rings)%1);
        const r=DOT+p*(MAX-DOT);
        X.beginPath(); X.arc(CX,CY,r,0,Math.PI*2);
        X.strokeStyle=rgb(c,(1-p)*0.8); X.lineWidth=sw; X.stroke();
      }
      const pulse=1+0.1*Math.sin(dt/400*Math.PI);
      // glow
      const g1=X.createRadialGradient(CX,CY,0,CX,CY,DOT*pulse*2.5);
      g1.addColorStop(0,rgb(c,0.3)); g1.addColorStop(1,rgb(c,0));
      X.beginPath(); X.arc(CX,CY,DOT*pulse*2.5,0,Math.PI*2); X.fillStyle=g1; X.fill();
      // core
      const g2=X.createRadialGradient(CX-DOT*.25,CY-DOT*.25,2,CX,CY,DOT*pulse);
      g2.addColorStop(0,'rgba(255,255,255,0.95)');
      g2.addColorStop(0.4,rgb(c,0.9));
      g2.addColorStop(1,rgb(c,0.5));
      X.beginPath(); X.arc(CX,CY,DOT*pulse,0,Math.PI*2); X.fillStyle=g2; X.fill();
    }

    particles = particles.filter(p=>p.a>0.01);
    for(const p of particles){
      p.x+=p.vx; p.y+=p.vy; p.vx*=0.95; p.vy*=0.95; p.a-=p.d;
      X.beginPath(); X.arc(p.x,p.y,p.r*p.a,0,Math.PI*2);
      X.fillStyle=rgb(p.col,p.a); X.fill();
    }
  }

  return {
    init(){ t0=performance.now(); particles=[]; startLoop(ts=>draw(ts)); },
    onStateChange(s){
      if(s==='LISTENING') spawn(COL.LISTENING);
      if(s==='SPEAKING')  spawn(COL.SPEAKING);
      if(s==='IDLE') t0=performance.now();
    }
  };
})();


// ═══════════════════════════════════════════════════
//  DEMO 2 — FREQUENCY RING (Equalizer)
// ═══════════════════════════════════════════════════
const demoFreq = (()=>{
  const N=64;
  let heights=new Float32Array(N), targets=new Float32Array(N), phase=0;
  let iv=null;

  function updateTargets(){
    const intensity = curState==='SPEAKING'?1:curState==='LISTENING'?0.5:curState==='THINKING'?0.2:0.05;
    for(let i=0;i<N;i++){
      targets[i] = Math.random()<0.25
        ? targets[i]*0.3
        : intensity*(0.1+Math.abs(Math.sin(i*0.35+phase))*0.9);
    }
    phase+=0.18;
  }

  function draw(ts){
    X.clearRect(0,0,W,H);
    const col = COL[curState]||[50,50,50];
    lerpRGB = lerpV(lerpRGB, col, 0.07);
    const c = lerpRGB;

    const baseR=90, maxBar=80, angle=Math.PI*2/N;

    // Center label ring
    if(curState!=='IDLE'){
      const g=X.createRadialGradient(CX,CY,0,CX,CY,baseR);
      g.addColorStop(0,rgb(c,0.18)); g.addColorStop(1,rgb(c,0));
      X.beginPath(); X.arc(CX,CY,baseR,0,Math.PI*2); X.fillStyle=g; X.fill();
      // inner dot
      X.beginPath(); X.arc(CX,CY,28,0,Math.PI*2);
      const gc=X.createRadialGradient(CX-8,CY-8,2,CX,CY,28);
      gc.addColorStop(0,'rgba(255,255,255,0.9)'); gc.addColorStop(1,rgb(c,0.7));
      X.fillStyle=gc; X.fill();
    }

    for(let i=0;i<N;i++){
      heights[i]=lerp(heights[i],targets[i],0.14);
      const h=heights[i]*maxBar;
      const a=i*angle-Math.PI/2;
      const x1=CX+Math.cos(a)*baseR, y1=CY+Math.sin(a)*baseR;
      const x2=CX+Math.cos(a)*(baseR+h), y2=CY+Math.sin(a)*(baseR+h);
      X.beginPath(); X.moveTo(x1,y1); X.lineTo(x2,y2);
      const alpha=0.4+heights[i]*0.6;
      X.strokeStyle=rgb(c,alpha); X.lineWidth=3.5; X.lineCap='round'; X.stroke();
    }
  }

  return {
    init(){
      heights.fill(0); targets.fill(0); phase=0;
      if(iv) clearInterval(iv);
      iv=setInterval(updateTargets,100);
      startLoop(draw);
    },
    onStateChange(){}
  };
})();


// ═══════════════════════════════════════════════════
//  DEMO 3 — NEURAL NETWORK
// ═══════════════════════════════════════════════════
const demoNeural = (()=>{
  const NODES=22;
  let nodes=[], pulses=[], t0=0;

  function makeNodes(){
    nodes=[];
    // center
    nodes.push({x:CX,y:CY,r:12,layer:0});
    // ring 1
    for(let i=0;i<6;i++){
      const a=i/6*Math.PI*2;
      nodes.push({x:CX+Math.cos(a)*90,y:CY+Math.sin(a)*90,r:8,layer:1});
    }
    // ring 2
    for(let i=0;i<10;i++){
      const a=i/10*Math.PI*2+0.3;
      nodes.push({x:CX+Math.cos(a)*165,y:CY+Math.sin(a)*165,r:6,layer:2});
    }
    // outer stragglers
    for(let i=0;i<5;i++){
      const a=i/5*Math.PI*2+0.7;
      nodes.push({x:CX+Math.cos(a)*200+Math.random()*20-10,
                  y:CY+Math.sin(a)*180+Math.random()*20-10,r:4,layer:3});
    }
    // build connections
    nodes.forEach((n,i)=>{
      n.connections=[];
      nodes.forEach((m,j)=>{
        if(i===j) return;
        const d=Math.hypot(n.x-m.x,n.y-m.y);
        if(d<120 && Math.abs(n.layer-m.layer)<=1) n.connections.push(j);
      });
    });
  }

  function spawnPulse(col){
    if(!nodes.length) return;
    const from=Math.floor(Math.random()*nodes.length);
    const n=nodes[from];
    if(!n.connections.length) return;
    const to=n.connections[Math.floor(Math.random()*n.connections.length)];
    pulses.push({from,to,t:0,speed:0.025+Math.random()*0.02,col,alpha:1});
  }

  function draw(ts){
    X.clearRect(0,0,W,H);
    const col = COL[curState]||[40,40,40];
    lerpRGB = lerpV(lerpRGB,col,0.05);
    const c=lerpRGB;
    const active = curState!=='IDLE';

    // edges
    nodes.forEach((n,i)=>{
      n.connections.forEach(j=>{
        const m=nodes[j];
        X.beginPath(); X.moveTo(n.x,n.y); X.lineTo(m.x,m.y);
        X.strokeStyle=rgb(c,active?0.12:0.05); X.lineWidth=1; X.stroke();
      });
    });

    // pulses
    pulses=pulses.filter(p=>p.t<1&&p.alpha>0.02);
    for(const p of pulses){
      p.t+=p.speed;
      p.alpha=Math.sin(p.t*Math.PI);
      const a=nodes[p.from], b=nodes[p.to];
      const px=lerp(a.x,b.x,p.t), py=lerp(a.y,b.y,p.t);
      X.beginPath(); X.arc(px,py,4,0,Math.PI*2);
      X.fillStyle=rgb(p.col,p.alpha*0.9); X.fill();
      // trail
      X.beginPath(); X.arc(px,py,8,0,Math.PI*2);
      X.fillStyle=rgb(p.col,p.alpha*0.25); X.fill();
    }

    // nodes
    nodes.forEach((n,i)=>{
      const glow = X.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r*2.5);
      glow.addColorStop(0,rgb(c,active?0.35:0.1)); glow.addColorStop(1,rgb(c,0));
      X.beginPath(); X.arc(n.x,n.y,n.r*2.5,0,Math.PI*2); X.fillStyle=glow; X.fill();
      X.beginPath(); X.arc(n.x,n.y,n.r,0,Math.PI*2);
      const ng=X.createRadialGradient(n.x-n.r*.3,n.y-n.r*.3,1,n.x,n.y,n.r);
      ng.addColorStop(0,'rgba(255,255,255,'+(active?'0.9':'0.3')+')');
      ng.addColorStop(1,rgb(c,active?0.7:0.2));
      X.fillStyle=ng; X.fill();
    });
  }

  let piv=null;
  return {
    init(){
      makeNodes(); pulses=[];
      if(piv) clearInterval(piv);
      piv=setInterval(()=>{ if(curState!=='IDLE') spawnPulse(COL[curState]||COL.LISTENING); },140);
      startLoop(draw);
    },
    onStateChange(s){ if(s==='LISTENING'||s==='SPEAKING') for(let i=0;i<6;i++) spawnPulse(COL[s]); }
  };
})();


// ═══════════════════════════════════════════════════
//  DEMO 4 — PARTICLE VORTEX
// ═══════════════════════════════════════════════════
const demoVortex = (()=>{
  const N=180;
  let pts=[];

  function reset(){
    pts=[];
    for(let i=0;i<N;i++){
      const a=Math.random()*Math.PI*2;
      const r=60+Math.random()*160;
      pts.push({
        x:CX+Math.cos(a)*r, y:CY+Math.sin(a)*r,
        baseA:a, baseR:r,
        speed:0.004+Math.random()*0.006,
        offset:Math.random()*Math.PI*2,
        size:1+Math.random()*2.5,
        alpha:0.3+Math.random()*0.5,
      });
    }
  }

  function draw(ts){
    X.clearRect(0,0,W,H);
    X.fillStyle='rgba(10,10,15,0.18)'; X.fillRect(0,0,W,H);
    const col=COL[curState]||[50,50,50];
    lerpRGB=lerpV(lerpRGB,col,0.06);
    const c=lerpRGB;
    const t=ts/1000;
    const active=curState!=='IDLE';

    // Vortex factor per state
    const swirl   = curState==='LISTENING'?1.2:curState==='THINKING'?0.3:curState==='SPEAKING'?2.2:0.4;
    const inward  = curState==='THINKING'?0.98:1.0;
    const scatter  = curState==='SPEAKING'?0.012:0;

    for(const p of pts){
      p.baseA += p.speed * swirl;
      p.baseR  = lerp(p.baseR, p.baseR*inward + (scatter*(Math.random()-0.5)*60), 0.05);
      if(p.baseR<20) p.baseR=20+Math.random()*40;

      const wobble = curState==='SPEAKING' ? Math.sin(t*3+p.offset)*15 : 0;
      const px=CX+Math.cos(p.baseA)*(p.baseR+wobble);
      const py=CY+Math.sin(p.baseA)*(p.baseR+wobble)*0.85;

      const fade=active?Math.min(1,p.alpha*1.6):p.alpha*0.3;
      X.beginPath(); X.arc(px,py,p.size,0,Math.PI*2);
      X.fillStyle=rgb(c,fade); X.fill();
    }

    if(active){
      // core
      const g=X.createRadialGradient(CX,CY,0,CX,CY,45);
      g.addColorStop(0,rgb(c,0.5)); g.addColorStop(0.5,rgb(c,0.12)); g.addColorStop(1,rgb(c,0));
      X.beginPath(); X.arc(CX,CY,45,0,Math.PI*2); X.fillStyle=g; X.fill();
      X.beginPath(); X.arc(CX,CY,18,0,Math.PI*2);
      const gc=X.createRadialGradient(CX-5,CY-5,1,CX,CY,18);
      gc.addColorStop(0,'rgba(255,255,255,0.95)'); gc.addColorStop(1,rgb(c,0.8));
      X.fillStyle=gc; X.fill();
    }
  }

  return { init(){ reset(); startLoop(draw); }, onStateChange(){} };
})();


// ═══════════════════════════════════════════════════
//  DEMO 5 — MORPHING GEOMETRY
// ═══════════════════════════════════════════════════
const demoGeo = (()=>{
  // Get N-gon vertices normalized
  function polygon(n, r, cx, cy, offset=0){
    return Array.from({length:n},(_,i)=>{
      const a=i/n*Math.PI*2+offset-Math.PI/2;
      return [cx+Math.cos(a)*r, cy+Math.sin(a)*r];
    });
  }

  // Resample to fixed number of points for morphing
  const STEPS=120;
  function resample(pts){
    const out=[];
    for(let i=0;i<STEPS;i++){
      const t=i/STEPS*pts.length;
      const a=Math.floor(t)%pts.length, b=(a+1)%pts.length;
      const f=t-Math.floor(t);
      out.push([lerp(pts[a][0],pts[b][0],f), lerp(pts[a][1],pts[b][1],f)]);
    }
    return out;
  }

  const shapes={
    TRI:  resample(polygon(3,130,CX,CY)),
    HEX:  resample(polygon(6,130,CX,CY,Math.PI/6)),
    OCT:  resample(polygon(8,130,CX,CY)),
    CIRC: resample(Array.from({length:STEPS},(_,i)=>{const a=i/STEPS*Math.PI*2; return [CX+Math.cos(a)*130,CY+Math.sin(a)*130];})),
  };

  let current=shapes.TRI, target=shapes.TRI, morphT=1, rot=0;

  const stateShapes={IDLE:'TRI',LISTENING:'HEX',THINKING:'CIRC',SPEAKING:'OCT'};

  function draw(ts){
    X.clearRect(0,0,W,H);
    const col=COL[curState]||[40,40,40];
    lerpRGB=lerpV(lerpRGB,col,0.05);
    const c=lerpRGB;
    const active=curState!=='IDLE';

    morphT=Math.min(1,morphT+0.025);
    rot += curState==='THINKING'?0.003:curState==='SPEAKING'?0.015:0.008;

    // Blend current→target
    const pts=current.map((p,i)=>[lerp(p[0],target[i][0],morphT),lerp(p[1],target[i][1],morphT)]);

    // Rotate around center
    const rotPts=pts.map(([x,y])=>{
      const dx=x-CX,dy=y-CY;
      return [CX+dx*Math.cos(rot)-dy*Math.sin(rot), CY+dx*Math.sin(rot)+dy*Math.cos(rot)];
    });

    // Outer glow fill
    if(active){
      X.beginPath(); X.moveTo(rotPts[0][0],rotPts[0][1]);
      rotPts.forEach(p=>X.lineTo(p[0],p[1])); X.closePath();
      X.fillStyle=rgb(c,0.08); X.fill();
    }

    // Draw layers
    for(let layer=0;layer<3;layer++){
      const scale=1-layer*0.08;
      const a=active?[0.9,0.5,0.2][layer]:[0.15,0.08,0.04][layer];
      X.beginPath();
      rotPts.forEach((p,i)=>{
        const sx=CX+(p[0]-CX)*scale, sy=CY+(p[1]-CY)*scale;
        i===0?X.moveTo(sx,sy):X.lineTo(sx,sy);
      });
      X.closePath();
      X.strokeStyle=rgb(c,a); X.lineWidth=[3,1.5,0.8][layer]; X.stroke();
    }

    // Vertices glow dots
    if(active){
      const step=Math.floor(STEPS/12);
      for(let i=0;i<STEPS;i+=step){
        const p=rotPts[i];
        X.beginPath(); X.arc(p[0],p[1],4,0,Math.PI*2);
        X.fillStyle=rgb(c,0.8); X.fill();
        X.beginPath(); X.arc(p[0],p[1],8,0,Math.PI*2);
        X.fillStyle=rgb(c,0.2); X.fill();
      }
    }

    // Center
    if(active){
      X.beginPath(); X.arc(CX,CY,22,0,Math.PI*2);
      const gc=X.createRadialGradient(CX-6,CY-6,1,CX,CY,22);
      gc.addColorStop(0,'rgba(255,255,255,0.95)'); gc.addColorStop(1,rgb(c,0.7));
      X.fillStyle=gc; X.fill();
    }
  }

  return {
    init(){ current=shapes.TRI; target=shapes.TRI; morphT=1; rot=0; startLoop(draw); },
    onStateChange(s){
      current=current.map((p,i)=>[lerp(p[0],target[i][0],morphT),lerp(p[1],target[i][1],morphT)]);
      target=shapes[stateShapes[s]||'TRI']; morphT=0;
    }
  };
})();


// ═══════════════════════════════════════════════════
//  DEMO 6 — AURORA PLASMA
// ═══════════════════════════════════════════════════
const demoAurora = (()=>{
  function plasma(x,y,t,freq){
    return (Math.sin(x*freq+t) + Math.sin(y*freq+t*1.3) +
            Math.sin((x+y)*freq*0.7+t*0.8) + Math.sin(Math.hypot(x-CX,y-CY)*freq*0.5+t*1.1))/4;
  }

  // Offscreen image data for plasma
  const OFF=new OffscreenCanvas(W,H);
  const OX=OFF.getContext('2d');
  const imgData=OX.createImageData(W,H);
  const px=imgData.data;

  const palettes={
    LISTENING: [[20,200,80],[50,255,120],[10,150,60]],
    THINKING:  [[20,100,255],[60,160,255],[0,60,200]],
    SPEAKING:  [[180,30,220],[230,80,255],[120,0,180]],
    IDLE:      [[20,20,40],[30,30,60],[15,15,30]],
  };

  function blendPal(a,b,t){ return a.map((v,i)=>Math.round(lerp(v,b[i],t))); }

  let curPal=palettes.IDLE, tgtPal=palettes.IDLE, palT=1;

  function draw(ts){
    const t=ts/1200;
    curPal=curPal.map((v,i)=>blendPal(v,tgtPal[i],Math.min(1,palT+=0.02)));
    const freq = curState==='SPEAKING'?0.025:curState==='THINKING'?0.012:0.018;

    // Downsample 4x for performance
    const S=4;
    for(let y=0;y<H;y+=S){
      for(let x=0;x<W;x+=S){
        const v=(plasma(x,y,t,freq)+1)/2;
        const v2=(plasma(x,y,t*0.7+1,freq*1.4)+1)/2;
        const c1=curPal[0], c2=curPal[1], c3=curPal[2];
        const r=Math.round(lerp(c1[0],c2[0],v)*0.6+c3[0]*v2*0.4);
        const g=Math.round(lerp(c1[1],c2[1],v)*0.6+c3[1]*v2*0.4);
        const b=Math.round(lerp(c1[2],c2[2],v)*0.6+c3[2]*v2*0.4);
        for(let dy=0;dy<S&&y+dy<H;dy++){
          for(let dx=0;dx<S&&x+dx<W;dx++){
            const i=((y+dy)*W+(x+dx))*4;
            px[i]=r; px[i+1]=g; px[i+2]=b; px[i+3]=255;
          }
        }
      }
    }
    OX.putImageData(imgData,0,0);

    X.clearRect(0,0,W,H);
    X.drawImage(OFF,0,0);

    // Vignette
    const vig=X.createRadialGradient(CX,CY,80,CX,CY,W*0.62);
    vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.72)');
    X.fillStyle=vig; X.fillRect(0,0,W,H);

    // Center orb
    if(curState!=='IDLE'){
      const col=COL[curState]||COL.LISTENING;
      const pulse=1+0.08*Math.sin(ts/350);
      const g=X.createRadialGradient(CX,CY,0,CX,CY,55*pulse);
      g.addColorStop(0,'rgba(255,255,255,0.95)');
      g.addColorStop(0.4,rgb(col,0.8));
      g.addColorStop(1,rgb(col,0));
      X.beginPath(); X.arc(CX,CY,55*pulse,0,Math.PI*2); X.fillStyle=g; X.fill();
    }
  }

  return {
    init(){ palT=1; startLoop(draw); },
    onStateChange(s){ tgtPal=palettes[s]||palettes.IDLE; palT=0; }
  };
})();
