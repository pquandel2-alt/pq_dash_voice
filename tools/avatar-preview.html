<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Particle Avatar – Reference | HIGH | AUTO</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#02040a;color:#bdefff;font:13px system-ui,sans-serif}
    header{min-height:86px;padding:9px 14px;background:#07121d;border-bottom:1px solid #12334a;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
    h1{margin:0;font-size:14px;letter-spacing:.04em}.metrics{color:#7eb9cf;line-height:1.45;text-align:center}.controls{display:flex;gap:6px}
    button{padding:6px 9px;background:#08283b;color:#bff;border:1px solid #176181;border-radius:4px;cursor:pointer}button.active{background:#0d6384;color:#fff}
    main{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:#173247}
    section{position:relative;overflow:hidden;background:#000;aspect-ratio:16/10}.label{position:absolute;z-index:3;top:8px;left:8px;padding:4px 7px;background:#001722dd;border:1px solid #165d73}
    img,iframe{display:block;width:100%;height:100%;border:0;background:#000}img{object-fit:contain}
    footer{padding:8px 14px;color:#6198ab;background:#07121d}.ok{color:#69e6cd}
  </style>
</head>
<body>
  <header>
    <h1>Reference-driven 2.5D Review</h1>
    <div class="metrics" id="metrics">Target Field wird geladen …</div>
    <div class="controls">
      <button data-state="IDLE" class="active">IDLE</button>
      <button data-state="LISTENING">LISTENING</button>
      <button data-state="THINKING">THINKING</button>
      <button data-state="SPEAKING">SPEAKING</button>
      <button id="assemble">ASSEMBLING</button>
    </div>
  </header>
  <main>
    <section><span class="label">REFERENCE · DEV-only</span><img id="reference" src="../app/src/main/assets/images/particle-humanoid-reference.jpg" alt="Stilreferenz"></section>
    <section><span class="label">NEW HIGH · 18.000 Punkte</span><iframe id="high" src="../app/src/main/assets/particle-screensaver.html?quality=HIGH&assembly=0"></iframe></section>
    <section><span class="label">AUTO · MatePad-Profil · 11.000 Punkte</span><iframe id="auto" src="../app/src/main/assets/particle-screensaver.html?quality=LOW&assembly=0"></iframe></section>
  </main>
  <footer id="profile">Referenz-Kopfmaske wird analysiert …</footer>
  <script>
    const frames=[document.querySelector('#high'),document.querySelector('#auto')];
    const reference=document.querySelector('#reference');
    const scenes=()=>frames.map(frame=>frame.contentWindow?.particleScene).filter(Boolean);
    document.querySelectorAll('[data-state]').forEach(button=>button.addEventListener('click',()=>{
      document.querySelectorAll('[data-state]').forEach(item=>item.classList.toggle('active',item===button));
      scenes().forEach(scene=>{scene.setState(button.dataset.state);scene.setAudioLevel(button.dataset.state==='SPEAKING'?.82:0)});
    }));
    document.querySelector('#assemble').addEventListener('click',()=>scenes().forEach(scene=>{
      scene.config.assemblyEnabled=true;scene.reset();scene.setState('ASSEMBLING');
    }));
    fetch('../app/src/main/assets/avatar-target.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{
      const m=data.metrics,c=data.counts;
      const head=(c.headBack||0)+(c.headMid||0)+(c.headFront||0)+(c.headBand||0)+(c.headRimInner||0)+(c.headRimMain||0)+(c.headRimHalo||0)+(c.faceCore||0);
      const shoulders=(c.shoulderBand||0)+(c.shoulderSurface||0)+(c.shoulderRim||0);
      document.querySelector('#metrics').innerHTML=
        `Kopf H/W <span class="ok">${m.headHeightToWidth}</span> · Crown <span class="ok">0.64</span> · Chin <span class="ok">0.54</span> · `+
        `Hals/Kopfhöhe <span class="ok">${(m.visibleNeckHeight/m.headHeight).toFixed(3)}</span> · Schulter/Kopf <span class="ok">${m.shoulderToHead}</span><br>`+
        `Core B/Kopf <span class="ok">${m.faceCoreToHeadWidth}</span> · Core H/Kopf <span class="ok">${(m.faceCoreHeight/m.headHeight).toFixed(3)}</span> · `+
        `${m.headBands} Head Bands · ${m.headBandSamplesMin}–${m.headBandSamplesMax} Samples · Kopf/Face ${(head/data.particleCount*100).toFixed(1)} % · Schulter ${(shoulders/data.particleCount*100).toFixed(1)} %`;
    });
    function analyseReference(){
      const off=document.createElement('canvas');off.width=reference.naturalWidth;off.height=reference.naturalHeight;
      const ctx=off.getContext('2d',{willReadFrequently:true});ctx.drawImage(reference,0,0);
      const image=ctx.getImageData(0,0,off.width,off.height).data;
      const top=.18*off.height,bottom=.52*off.height,rows=[.1,.2,.3,.4,.5,.6,.7,.8,.9],widths=[];
      for(const f of rows){const y=Math.round(top+(bottom-top)*f);let left=off.width,right=0;
        for(let x=Math.round(off.width*.27);x<Math.round(off.width*.73);x++){const i=(y*off.width+x)*4,r=image[i],g=image[i+1],b=image[i+2];if(g>85&&b>95&&b>r*1.12){left=Math.min(left,x);right=Math.max(right,x)}}
        widths.push(Math.max(0,right-left));}
      const max=Math.max(...widths,1),normalized=widths.map(width=>(width/max).toFixed(2));
      document.querySelector('#profile').innerHTML=`DEV Kopfmaske · Referenzbreite 10…90 %: <span class="ok">${normalized.join(' · ')}</span> · `+
        `Neue gemeinsame Boundary: <span class="ok">0.82 · 0.94 · 0.98 · 1.00 · 0.99 · 0.95 · 0.89 · 0.77 · 0.64</span>`;
    }
    if(reference.complete)analyseReference();else reference.addEventListener('load',analyseReference,{once:true});
  </script>
</body>
</html>
