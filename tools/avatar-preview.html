<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Particle Avatar – Production Renderer Review</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:#02040a;color:#bdefff;font:14px system-ui,sans-serif;overflow:hidden}
    header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#07121d;border-bottom:1px solid #12334a}
    h1{margin:0;font-size:14px;font-weight:600;letter-spacing:.04em}.controls{display:flex;gap:7px}
    button{padding:7px 11px;background:#08283b;color:#bff;border:1px solid #176181;border-radius:4px;cursor:pointer}button.active{background:#0d6384;color:#fff}
    main{height:calc(100% - 52px);display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;gap:1px;background:#173247}
    section{position:relative;overflow:hidden;background:#000;aspect-ratio:16/10}.label{position:absolute;z-index:3;top:10px;left:10px;padding:5px 8px;background:#001722cc;border:1px solid #165d73}
    img,iframe,canvas{display:block;width:100%;height:100%;border:0;background:#000}img{object-fit:contain}
  </style>
</head>
<body>
  <header>
    <h1>Produktiver Renderer · visueller Vergleich · 16:10</h1>
    <div class="controls">
      <button data-state="IDLE" class="active">IDLE</button>
      <button data-state="LISTENING">LISTENING</button>
      <button data-state="THINKING">THINKING</button>
      <button data-state="SPEAKING">SPEAKING</button>
      <button id="assemble">ASSEMBLING</button>
    </div>
  </header>
  <main>
    <section><span class="label">Stilreferenz · nur Review, kein Runtime-Asset</span><img src="../app/src/main/assets/images/particle-humanoid-reference.jpg" alt="Stilreferenz"></section>
    <section><span class="label">Produktives particle-screensaver.html · HIGH</span><iframe id="renderer" src="../app/src/main/assets/particle-screensaver.html?quality=HIGH&assembly=0"></iframe></section>
    <section><span class="label">Aktive native APK-Geometrie · 9.400 Punkte</span><canvas id="native"></canvas></section>
  </main>
  <script>
    const frame=document.querySelector('#renderer');let nativeState='IDLE';
    function scene(){return frame.contentWindow?.particleScene}
    document.querySelectorAll('[data-state]').forEach(button=>button.addEventListener('click',()=>{
      document.querySelectorAll('[data-state]').forEach(x=>x.classList.toggle('active',x===button));
      scene()?.setState(button.dataset.state);
      scene()?.setAudioLevel(button.dataset.state==='SPEAKING'?.82:0);
      nativeState=button.dataset.state;
    }));
    document.querySelector('#assemble').addEventListener('click',()=>{
      const s=scene();if(!s)return;s.config.assemblyEnabled=true;s.reset();s.setState('ASSEMBLING');
    });
    const canvas=document.querySelector('#native'),ctx=canvas.getContext('2d');
    const geometry=fetch('../app/src/main/assets/avatar-geometry.json').then(r=>r.json());
    function glow(cx,cy,rx,ry,active){ctx.save();ctx.translate(cx,cy);ctx.scale(rx/ry,1);const g=ctx.createRadialGradient(0,0,0,0,0,ry);g.addColorStop(0,`rgba(255,245,180,${.78+active*.18})`);g.addColorStop(.25,'rgba(255,173,24,.58)');g.addColorStop(.66,'rgba(255,90,0,.22)');g.addColorStop(1,'rgba(255,90,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,ry,0,Math.PI*2);ctx.fill();ctx.restore()}
    geometry.then(data=>{const started=performance.now();function draw(now){const dpr=Math.min(devicePixelRatio||1,1.5),w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==w*dpr||canvas.height!==h*dpr){canvas.width=w*dpr;canvas.height=h*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);const t=(now-started)/1000,active=nativeState==='LISTENING'?.9:nativeState==='SPEAKING'?.55+.35*(Math.sin(t*9)+1)/2:0;glow(w*.5,h*.378,w*.022*(1+active*.08),h*.085*(1+active*.08),active);for(const p of data.particles){const sway=Math.sin(t*.58)*w*.0045*(1.15-p.y);const x=p.x*w+sway+Math.sin(t*(.72+p.drift*.055)+p.phase)*p.drift*.45;const y=p.y*h+Math.cos(t*(.61+p.drift*.047)+p.phase)*p.drift*.45;const pulse=.74+.26*Math.sin(t*2.4+p.phase),halo={head:.08,shoulder:.10,neck:.08,neckEnergy:.08,flow:.08,torso:.055,aura:.025,core:.16,chestCore:.16}[p.region]||0;ctx.fillStyle=`rgb(${p.color.join(',')})`;if(halo){ctx.globalAlpha=halo*p.brightness;ctx.beginPath();ctx.arc(x,y,Math.max(1,p.radius*2.65),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=Math.max(.18,Math.min(1,p.brightness*pulse+.2));ctx.beginPath();ctx.arc(x,y,Math.max(.5,p.radius*(.72+pulse*.28)),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(draw)}requestAnimationFrame(draw)});
  </script>
</body>
</html>
