<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle AI Screensaver</title>
    <style>
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #canvas { display: block; width: 100%; height: 100%; }
        #debugInfo {
            position: absolute; top: 10px; left: 10px;
            color: #0f0; font-family: monospace; font-size: 12px;
            opacity: 0.5; pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="debugInfo"></div>

    <!-- Three.js library (included inline or local) -->
    <script src="js/three.min.js"></script>

    <!-- Particle Scene Logic -->
    <script src="js/particle-scene.js"></script>

    <script>
        // Initialize particle scene when page loads
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('canvas');
            window.particleScene = new ParticleScene(canvas);
            window.particleScene.start();
        });

        // Stop animation when page is hidden (tab/app backgrounded)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                window.particleScene?.pause();
            } else {
                window.particleScene?.resume();
            }
        });

        // Prevent default touch behaviors
        document.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    </script>
</body>
</html>
