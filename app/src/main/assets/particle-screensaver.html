<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle AI Screensaver</title>
    <style>
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #canvas, #fallbackCanvas {
            position: relative; z-index: 1;
            display: block; width: 100%; height: 100%;
            opacity: 1;
        }
        #fallbackCanvas { display: none; position: fixed; inset: 0; }
        #debugInfo {
            position: absolute; top: 10px; left: 10px;
            color: #0f0; font-family: monospace; font-size: 12px;
            opacity: 0.5; pointer-events: none; z-index: 2;
        }
        .assistantText {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            max-width: 82%;
            text-align: center;
            color: #7fd9ff;
            font-family: sans-serif;
            font-size: 20px;
            line-height: 1.4;
            text-shadow: 0 0 8px rgba(127, 217, 255, 0.8);
            pointer-events: none;
            display: none; z-index: 2;
        }
        #transcriptOverlay { bottom: 20%; opacity: 0.8; font-size: 17px; }
        #responseOverlay { bottom: 11%; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <canvas id="fallbackCanvas"></canvas>
    <div id="debugInfo"></div>
    <div id="transcriptOverlay" class="assistantText"></div>
    <div id="responseOverlay" class="assistantText"></div>

    <!-- Three.js library, vendored locally (no CDN at runtime) -->
    <script src="js/three.min.js"></script>

    <!-- Particle Scene Logic -->
    <script src="js/particle-scene.js"></script>
    <script src="js/particle-canvas-scene.js"></script>

    <script>
        // Transcript/response overlay bridge, called from Kotlin via evaluateJavascript.
        window.setTranscript = function (text) {
            const el = document.getElementById('transcriptOverlay');
            if (!el) return;
            if (text) { el.textContent = text; el.style.display = 'block'; }
            else { el.style.display = 'none'; }
        };
        window.setResponse = function (text) {
            const el = document.getElementById('responseOverlay');
            if (!el) return;
            if (text) { el.textContent = text; el.style.display = 'block'; }
            else { el.style.display = 'none'; }
        };

        // Initialize particle scene when page loads. Config comes from the URL query string
        // (set by MainActivity on every loadUrl) so it's available deterministically before
        // the scene is constructed — no race with evaluateJavascript() timing.
        window.addEventListener('DOMContentLoaded', async () => {
            const canvas = document.getElementById('canvas');
            const fallbackCanvas = document.getElementById('fallbackCanvas');
            const params = new URLSearchParams(location.search);
            const renderer = params.get('renderer') || 'webgl';
            try {
                if (renderer === 'canvas') {
                    canvas.style.display = 'none';
                    fallbackCanvas.style.display = 'block';
                    window.particleScene = new CanvasParticleScene(fallbackCanvas);
                    await window.particleScene.prepare();
                } else {
                    window.particleScene = new ParticleScene(canvas);
                }
                window.particleScene.configure({
                    quality: params.get('quality') || 'AUTO',
                    animationSpeedMultiplier: parseFloat(params.get('speed')) || 1.0,
                    assemblyEnabled: params.get('assembly') !== '0',
                    debug: params.get('debug') === '1',
                });
                window.particleScene.start();
                window.particleScene.setState('ASSEMBLING');
            } catch (error) {
                // Keep the independent procedural Canvas renderer as the last-resort fallback.
                console.error(`Particle renderer failed: ${error?.stack || error}`);
                canvas.style.display = 'none';
                fallbackCanvas.style.display = 'block';
                window.particleScene = new CanvasParticleScene(fallbackCanvas);
                await window.particleScene.prepare();
                window.particleScene.configure({ quality: 'LOW', assemblyEnabled: true });
                window.particleScene.start();
                window.particleScene.setState('ASSEMBLING');
            }
        });

        // Stop animation when page is hidden (tab/app backgrounded)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                window.particleScene?.pause();
            } else {
                window.particleScene?.resume();
            }
        });

        // Prevent default touch behaviors
        document.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    </script>
</body>
</html>
